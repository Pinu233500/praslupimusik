<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrasLupi Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    input[type=range] { accent-color: #6366f1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i data-lucide="disc-3" class="w-6 h-6 text-white animate-spin-slow"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">PrasLupi Music</h1>
          <p class="text-[11px] text-slate-400">Google Drive Cloud Storage</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="auth-btn" onclick="handleAuthClick()" class="bg-slate-800 hover:bg-slate-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition border border-slate-700">
          <i data-lucide="log-in" class="w-4 h-4 text-indigo-400"></i> <span id="auth-status">Login Google Drive</span>
        </button>
        <label for="audio-upload" id="upload-label" class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-lg shadow-indigo-600/30 opacity-50 pointer-events-none">
          <i data-lucide="upload-cloud" class="w-4 h-4"></i> <span id="upload-status">Upload MP3</span>
        </label>
        <input type="file" id="audio-upload" accept="audio/*" class="hidden" onchange="uploadToGoogleDrive(event)">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Player & Equalizer -->
    <section class="lg:col-span-7 space-y-6">
      <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center text-center">
        <div class="w-44 h-44 rounded-full bg-slate-950 border-4 border-slate-800 shadow-2xl flex items-center justify-center relative my-4">
          <div id="art-disc" class="w-full h-full rounded-full bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center">
            <i data-lucide="music-4" class="w-20 h-20 text-slate-700"></i>
          </div>
          <div class="w-12 h-12 rounded-full bg-slate-950 border-2 border-slate-800 absolute flex items-center justify-center">
            <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
          </div>
        </div>

        <div class="space-y-1 max-w-md">
          <h2 id="current-title" class="text-lg font-bold text-white truncate">Belum ada lagu diputar</h2>
          <p id="current-artist" class="text-xs text-slate-400">Pilih dari Google Drive Playlist</p>
        </div>

        <div class="w-full h-16 mt-4">
          <canvas id="visualizer" class="w-full h-full rounded-xl"></canvas>
        </div>
      </div>

      <!-- Equalizer Controls -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-indigo-400"></i>
            <h3 class="text-sm font-bold text-white">Equalizer Controls</h3>
          </div>
          <button onclick="resetEQ()" class="text-xs text-slate-400 hover:text-indigo-400 transition flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-2">
          <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i data-lucide="speaker" class="w-4 h-4 text-emerald-400"></i> Bass (Low EQ)</span>
              <span id="bass-val" class="text-xs font-mono font-bold text-emerald-400">0 dB</span>
            </div>
            <input type="range" id="bass-slider" min="-12" max="15" value="0" step="1" oninput="updateBass(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
          </div>

          <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i data-lucide="mic" class="w-4 h-4 text-pink-400"></i> Vokal (Mid EQ)</span>
              <span id="vocal-val" class="text-xs font-mono font-bold text-pink-400">0 dB</span>
            </div>
            <input type="range" id="vocal-slider" min="-12" max="15" value="0" step="1" oninput="updateVocal(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
          </div>
        </div>
      </div>
    </section>

    <!-- Playlist Cloud -->
    <section class="lg:col-span-5 flex flex-col">
      <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-5 shadow-xl flex-1">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <i data-lucide="folder-heart" class="w-5 h-5 text-indigo-400"></i>
            <h3 class="text-sm font-bold text-white">Google Drive Playlist</h3>
          </div>
          <span id="track-count" class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-0.5 rounded-full">0 Lagu</span>
        </div>

        <div id="playlist-items" class="space-y-2 overflow-y-auto max-h-[380px]">
          <div class="text-center py-12 text-slate-500 space-y-2">
            <i data-lucide="info" class="w-8 h-8 mx-auto opacity-40"></i>
            <p class="text-xs">Silakan login Google Drive<br>untuk upload dan memuat lagu.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Control Bar -->
  <footer class="bg-slate-900/90 border-t border-slate-800 backdrop-blur-xl sticky bottom-0 z-50 py-3 px-4">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="w-full flex items-center gap-3">
        <span id="current-time" class="text-xs font-mono text-slate-400 w-10 text-right">0:00</span>
        <input type="range" id="progress-bar" min="0" max="100" value="0" oninput="seekAudio(this.value)" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer flex-1">
        <span id="total-duration" class="text-xs font-mono text-slate-400 w-10">0:00</span>
      </div>

      <div class="flex items-center justify-between w-full sm:w-auto gap-6">
        <div class="flex items-center gap-4 mx-auto sm:mx-0">
          <button onclick="prevTrack()" class="text-slate-400 hover:text-white"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
          <button onclick="togglePlayPause()" id="btn-play" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shadow-lg shadow-indigo-600/40">
            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
          </button>
          <button onclick="nextTrack()" class="text-slate-400 hover:text-white"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="volume-2" class="w-4 h-4 text-slate-400"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="updateVolume(this.value)" class="w-20 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        </div>
      </div>
    </div>
  </footer>

  <audio id="audio-player" class="hidden" crossorigin="anonymous"></audio>

  <script>
    const CLIENT_ID = '524216548694-b7dsledl0lvtrhpbhgp2dkbpgn0ro6hn.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyAHeL5n-Dw4sb7nV4cLvz_IBiaMHpPaPrQ';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let tokenClient;
    let accessToken = null;
    let playlist = [];
    let currentTrackIndex = -1;
    let audioCtx, source, bassFilter, vocalFilter, analyser;
    let isAudioCtxSetup = false;

    const audioPlayer = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (response) => {
          if (response.error) return;
          accessToken = response.access_token;
          document.getElementById('auth-status').innerText = 'Drive Terhubung';
          document.getElementById('upload-label').classList.remove('opacity-50', 'pointer-events-none');
          fetchDriveSongs();
        },
      });
    }

    window.onload = () => {
      setTimeout(() => {
        if (window.gapi) gapiLoaded();
        if (window.google) gisLoaded();
      }, 1000);
    };

    function handleAuthClick() {
      if (!accessToken) tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    async function fetchDriveSongs() {
      try {
        const res = await gapi.client.drive.files.list({
          q: "mimeType contains 'audio/' and trashed = false",
          fields: 'files(id, name, webContentLink)',
        });
        playlist = res.result.files.map(f => ({
          id: f.id,
          title: f.name.replace(/\.[^/.]+$/, ""),
          url: `https://docs.google.com/uc?export=download&id=${f.id}`
        }));
        renderPlaylist();
      } catch (err) {
        console.error("Gagal mengambil file Drive:", err);
      }
    }

    async function uploadToGoogleDrive(e) {
      const file = e.target.files[0];
      if (!file || !accessToken) return;

      const statusEl = document.getElementById('upload-status');
      statusEl.innerText = "Uploading Drive...";

      const metadata = { name: file.name, mimeType: file.type };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', file);

      try {
        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
          body: form,
        });
        const data = await res.json();
        
        // Buat file publik
        await gapi.client.drive.permissions.create({
          fileId: data.id,
          resource: { role: 'reader', type: 'anyone' }
        });

        statusEl.innerText = "Berhasil!";
        setTimeout(() => statusEl.innerText = "Upload MP3", 2000);
        fetchDriveSongs();
      } catch (err) {
        alert("Gagal upload ke Drive!");
        statusEl.innerText = "Upload MP3";
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist-items');
      document.getElementById('track-count').innerText = `${playlist.length} Lagu`;

      if (playlist.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 space-y-2">
            <i data-lucide="music" class="w-8 h-8 mx-auto opacity-40"></i>
            <p class="text-xs">Belum ada file musik di Drive.<br>Upload lagu pertama kamu!</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      container.innerHTML = playlist.map((track, i) => `
        <div onclick="loadTrack(${i})" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer transition ${i === currentTrackIndex ? 'bg-indigo-600/20 border border-indigo-500/40 text-white' : 'bg-slate-950/40 hover:bg-slate-950/80 border border-slate-800/50 text-slate-300'}">
          <div class="flex items-center gap-3 truncate">
            <div class="w-8 h-8 rounded-xl ${i === currentTrackIndex ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} flex items-center justify-center shrink-0">
              <i data-lucide="${i === currentTrackIndex ? 'disc' : 'music'}" class="w-4 h-4"></i>
            </div>
            <p class="text-xs font-semibold truncate">${track.title}</p>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function setupWebAudio() {
      if (isAudioCtxSetup) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audioPlayer);
      
      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 200;
      bassFilter.gain.value = 0;

      vocalFilter = audioCtx.createBiquadFilter();
      vocalFilter.type = 'peaking';
      vocalFilter.frequency.value = 1500;
      vocalFilter.Q.value = 1;
      vocalFilter.gain.value = 0;

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;

      source.connect(bassFilter);
      bassFilter.connect(vocalFilter);
      vocalFilter.connect(analyser);
      analyser.connect(audioCtx.destination);

      isAudioCtxSetup = true;
      drawVisualizer();
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentTrackIndex = index;
      audioPlayer.src = playlist[index].url;
      document.getElementById('current-title').innerText = playlist[index].title;
      renderPlaylist();
      playAudio();
    }

    function playAudio() {
      setupWebAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioPlayer.play();
      playBtn.innerHTML = `<i data-lucide="pause" class="w-5 h-5 fill-current"></i>`;
      lucide.createIcons();
    }

    function pauseAudio() {
      audioPlayer.pause();
      playBtn.innerHTML = `<i data-lucide="play" class="w-5 h-5 fill-current"></i>`;
      lucide.createIcons();
    }

    function togglePlayPause() {
      if (playlist.length === 0) return;
      audioPlayer.paused ? playAudio() : pauseAudio();
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      loadTrack((currentTrackIndex + 1) % playlist.length);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      loadTrack((currentTrackIndex - 1 + playlist.length) % playlist.length);
    }

    function updateBass(val) {
      document.getElementById('bass-val').innerText = `${val > 0 ? '+' : ''}${val} dB`;
      if (bassFilter) bassFilter.gain.value = parseFloat(val);
    }

    function updateVocal(val) {
      document.getElementById('vocal-val').innerText = `${val > 0 ? '+' : ''}${val} dB`;
      if (vocalFilter) vocalFilter.gain.value = parseFloat(val);
    }

    function resetEQ() {
      document.getElementById('bass-slider').value = 0;
      document.getElementById('vocal-slider').value = 0;
      updateBass(0);
      updateVocal(0);
    }

    function updateVolume(val) { audioPlayer.volume = val; }

    function seekAudio(val) {
      if (audioPlayer.duration) audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
    }

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
        totalDurationEl.innerText = formatTime(audioPlayer.duration);
      }
    });

    audioPlayer.addEventListener('ended', nextTrack);

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / dataArray.length) * 2;
      let x = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#6366f1');
        gradient.addColorStop(1, '#ec4899');
        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
