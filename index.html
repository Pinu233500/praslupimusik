<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrasLupi Musik - Cloud Sync</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      height: 5px;
      border-radius: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(129, 140, 248, 0.5);
    }
    @keyframes spin-vinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-vinyl {
      animation: spin-vinyl 4s linear infinite;
    }
    .vinyl-grooves {
      background: radial-gradient(circle, #111 18%, #222 20%, #111 25%, #2a2a2a 35%, #111 40%, #222 55%, #111 60%, #222 70%);
    }
    .tonearm {
      transform-origin: 18px 18px;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tonearm-playing { transform: rotate(24deg); }
    .tonearm-idle { transform: rotate(0deg); }
    
    /* Scrollbar halus untuk daftar lagu */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0e1322;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white h-screen w-screen overflow-hidden flex flex-col p-3 md:p-4 font-sans">

  <!-- HEADER / AUTH BAR -->
  <header class="w-full max-w-6xl mx-auto flex justify-between items-center bg-[#151c2e] px-4 py-2.5 rounded-xl border border-slate-800 shadow-md mb-3 flex-shrink-0">
    <div class="flex items-center gap-2">
      <i data-lucide="disc-3" class="text-indigo-400 w-6 h-6 animate-spin-slow"></i>
      <h1 class="font-bold text-base md:text-lg tracking-wide text-slate-100">PrasLupi <span class="text-indigo-400">Musik</span></h1>
    </div>
    <div id="auth-section">
      <button id="login-btn" onclick="handleAuthClick()" class="py-1.5 px-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-xs transition flex items-center gap-2 shadow-md shadow-indigo-600/20">
        <i data-lucide="cloud" class="w-4 h-4"></i> Sync Google Drive
      </button>
      <button id="logout-btn" onclick="handleLogout()" class="hidden py-1.5 px-3 bg-red-500 hover:bg-red-600 font-semibold rounded-lg text-xs transition flex items-center gap-2 shadow-md shadow-red-500/20">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER (NO SCROLL FIT) -->
  <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-3 flex-grow overflow-hidden min-h-0">

    <!-- LEFT COLUMN: PLAYER & EQUALIZER (5 Cols) -->
    <section class="md:col-span-5 flex flex-col gap-3 h-full overflow-hidden">
      
      <!-- PLAYER CARD -->
      <div class="bg-[#151c2e] p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between flex-grow overflow-hidden">
        
        <!-- VINYL ARTWORK -->
        <div class="relative bg-[#0e1322] border border-slate-800/80 p-3 rounded-xl flex items-center justify-center overflow-hidden shadow-inner flex-grow min-h-0">
          <div id="vinyl-disc" class="w-32 h-32 sm:w-40 sm:h-40 rounded-full vinyl-grooves border-4 border-slate-900 shadow-2xl flex items-center justify-center relative transition-transform">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-700 to-pink-600 border-2 border-slate-900 flex items-center justify-center shadow-md">
              <div class="w-3 h-3 rounded-full bg-[#0b0f19] border border-slate-700"></div>
            </div>
          </div>
          <div id="tonearm" class="tonearm tonearm-idle absolute top-2 right-6 w-10 h-32 pointer-events-none z-10">
            <div class="w-8 h-8 rounded-full bg-slate-700 border-2 border-slate-500 shadow-md flex items-center justify-center">
              <div class="w-4 h-4 rounded-full bg-slate-900 border border-slate-600"></div>
            </div>
            <div class="w-1.5 h-20 bg-gradient-to-r from-slate-300 via-slate-100 to-slate-400 rounded-full ml-[13px] -mt-1 shadow-lg"></div>
            <div class="w-3 h-6 bg-slate-900 border border-slate-600 rounded-sm ml-[10px] -mt-1 shadow-md transform -rotate-12"></div>
          </div>
        </div>

        <!-- TRACK INFO & VISUALIZER -->
        <div class="my-2">
          <div id="current-title" class="text-center font-semibold text-slate-200 text-xs sm:text-sm truncate px-2 mb-1.5">
            Tidak ada lagu dipilih
          </div>
          <div class="w-full bg-[#0e1322] p-1.5 rounded-lg border border-slate-800/80 flex justify-center items-center">
            <canvas id="visualizer" class="w-full h-6 rounded"></canvas>
          </div>
        </div>

        <audio id="audio-player" crossorigin="anonymous"></audio>

        <!-- PROGRESS BAR -->
        <div class="flex items-center gap-2 text-[11px] text-slate-400 mb-1">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekAudio()" class="w-full">
          <span id="duration-time">0:00</span>
        </div>

        <!-- CONTROLS -->
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-center px-1">
            <button id="shuffle-btn" onclick="toggleShuffle()" class="text-slate-400 hover:text-white transition" title="Acak">
              <i data-lucide="shuffle" class="w-4 h-4"></i>
            </button>
            <div class="flex items-center gap-4">
              <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition">
                <i data-lucide="skip-back" class="w-5 h-5"></i>
              </button>
              <button id="play-btn" onclick="togglePlay()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center transition shadow-md shadow-indigo-600/40">
                <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
              </button>
              <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition">
                <i data-lucide="skip-forward" class="w-5 h-5"></i>
              </button>
            </div>
            <button id="repeat-btn" onclick="toggleRepeat()" class="text-slate-400 hover:text-white transition" title="Ulangi">
              <i data-lucide="repeat" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex items-center gap-2 bg-[#0e1322] px-2.5 py-1.5 rounded-lg border border-slate-800/80">
            <i data-lucide="volume-2" class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" oninput="adjustVolume()" class="w-full">
          </div>
        </div>

      </div>

      <!-- EQUALIZER CARD (COMPACT) -->
      <div class="bg-[#151c2e] p-3 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-2 flex-shrink-0">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-1.5 font-bold text-xs text-slate-200">
            <i data-lucide="sliders" class="text-indigo-400 w-4 h-4"></i> Equalizer
          </div>
          <button onclick="resetEQ()" class="text-[10px] text-slate-400 hover:text-white flex items-center gap-1 transition">
            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-[#0e1322] p-2 rounded-lg border border-slate-800/80">
            <div class="flex justify-between text-[11px] mb-1">
              <span class="text-emerald-400 font-medium">Bass</span>
              <span id="bass-val" class="font-bold text-emerald-400">0 dB</span>
            </div>
            <input type="range" id="bass" min="-12" max="12" value="0" oninput="updateEQ()" class="w-full">
          </div>

          <div class="bg-[#0e1322] p-2 rounded-lg border border-slate-800/80">
            <div class="flex justify-between text-[11px] mb-1">
              <span class="text-pink-400 font-medium">Vokal</span>
              <span id="vokal-val" class="font-bold text-pink-400">0 dB</span>
            </div>
            <input type="range" id="vokal" min="-12" max="12" value="0" oninput="updateEQ()" class="w-full">
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT COLUMN: PLAYLIST & ALBUM (7 Cols) -->
    <section class="md:col-span-7 bg-[#151c2e] p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col h-full overflow-hidden">
      
      <!-- HEADER PLAYLIST -->
      <div class="flex justify-between items-center mb-3 flex-shrink-0">
        <div class="flex items-center gap-2 font-bold text-sm md:text-base text-slate-100">
          <i data-lucide="folder-heart" class="text-indigo-400 w-5 h-5"></i> Playlist & Album
        </div>
        <span id="track-count" class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 text-[11px] px-2.5 py-0.5 rounded-full font-medium">0 Lagu</span>
      </div>

      <!-- ALBUM & UPLOAD ACTIONS -->
      <div class="flex flex-col gap-2 mb-3 flex-shrink-0">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="file" id="local-file-input" accept="audio/*" multiple class="hidden" onchange="uploadToGoogleDrive(event)">
          <button onclick="triggerUpload()" id="upload-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/20">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i> Tambah Lagu
          </button>

          <div class="flex gap-1.5">
            <input type="text" id="album-input" placeholder="Album Baru..." class="flex-grow bg-[#0e1322] text-xs px-2.5 py-1.5 rounded-lg border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            <button onclick="createAlbumFolder()" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 flex-shrink-0">
              <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> Buat
            </button>
          </div>
        </div>

        <div id="upload-status" class="hidden text-[11px] text-indigo-300 text-center py-1 bg-[#0e1322] rounded-lg border border-slate-800 animate-pulse">
          Proses unggah lagu ke Google Drive...
        </div>

        <!-- ALBUM TABS -->
        <div class="flex items-center gap-1.5 overflow-x-auto py-1 scrollbar-none" id="album-tabs">
          <button class="album-btn bg-indigo-600 text-white text-[11px] px-2.5 py-1 rounded-lg font-medium transition flex-shrink-0">Semua</button>
        </div>
      </div>

      <!-- PLAYLIST ITEM CONTAINER (FLEX-GROW WITH AUTO SCROLL) -->
      <div id="playlist-container" class="flex flex-col gap-1.5 flex-grow overflow-y-auto pr-1 min-h-0">
        <div class="text-slate-400 text-xs text-center py-10">Silakan "Sync Google Drive" untuk memuat lagu & album.</div>
      </div>

    </section>

  </main>

  <script>
    const CLIENT_ID = '524216548694-b7dsledl0lvtrhpbhgp2dkbpgn0ro6hn.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let playlist = [];
    let driveFolders = [{ id: 'all', name: 'Semua' }];
    let currentAlbumId = 'all';
    let currentTrackIndex = -1;

    let isShuffle = false;
    let isRepeat = false;

    let audioCtx, trackSource, bassFilter, vokalFilter, analyser;
    const audioPlayer = document.getElementById('audio-player');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        trackSource = audioCtx.createMediaElementSource(audioPlayer);

        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 250;

        vokalFilter = audioCtx.createBiquadFilter();
        vokalFilter.type = 'peaking';
        vokalFilter.frequency.value = 1000;
        vokalFilter.Q.value = 1;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        trackSource.connect(bassFilter);
        bassFilter.connect(vokalFilter);
        vokalFilter.connect(analyser);
        analyser.connect(audioCtx.destination);

        drawVisualizer();
      }
    }

    function drawVisualizer() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function renderFrame() {
        requestAnimationFrame(renderFrame);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 1.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = (dataArray[i] / 255) * canvas.height;

          const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
          gradient.addColorStop(0, '#6366f1');
          gradient.addColorStop(1, '#ec4899');

          canvasCtx.fillStyle = gradient;
          canvasCtx.beginPath();
          canvasCtx.roundRect(x, canvas.height - barHeight, barWidth - 2, barHeight, 3);
          canvasCtx.fill();

          x += barWidth + 1;
        }
      }
      renderFrame();
    }

    function updateEQ() {
      const bass = document.getElementById('bass').value;
      const vokal = document.getElementById('vokal').value;

      document.getElementById('bass-val').innerText = `${bass} dB`;
      document.getElementById('vokal-val').innerText = `${vokal} dB`;

      if (bassFilter) bassFilter.gain.value = bass;
      if (vokalFilter) vokalFilter.gain.value = vokal;
    }

    function resetEQ() {
      document.getElementById('bass').value = 0;
      document.getElementById('vokal').value = 0;
      updateEQ();
    }

    window.onload = () => {
      lucide.createIcons();

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            localStorage.setItem('gdrive_access_token', accessToken);
            onLoginSuccess();
          }
        },
      });

      const savedToken = localStorage.getItem('gdrive_access_token');
      if (savedToken) {
        accessToken = savedToken;
        onLoginSuccess();
      }
    };

    function handleAuthClick() {
      if (!accessToken) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      }
    }

    function handleLogout() {
      localStorage.removeItem('gdrive_access_token');
      accessToken = null;
      location.reload();
    }

    function onLoginSuccess() {
      document.getElementById('login-btn').classList.add('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      syncDriveData();
    }

    async function createAlbumFolder() {
      const nameInput = document.getElementById('album-input');
      const folderName = nameInput.value.trim();

      if (!folderName) {
        alert('Masukkan nama album terlebih dahulu!');
        return;
      }
      if (!accessToken) {
        alert('Silakan login Google Drive terlebih dahulu!');
        return;
      }

      try {
        const metadata = {
          name: folderName,
          mimeType: 'application/vnd.google-apps.folder'
        };

        const res = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(metadata)
        });

        if (res.ok) {
          nameInput.value = '';
          await syncDriveData();
        } else {
          alert('Gagal membuat folder album di Google Drive.');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function triggerUpload() {
      if (!accessToken) {
        alert('Silakan Sync Google Drive terlebih dahulu!');
        handleAuthClick();
        return;
      }
      document.getElementById('local-file-input').click();
    }

    async function uploadToGoogleDrive(event) {
      const files = event.target.files;
      if (!files.length) return;

      const statusEl = document.getElementById('upload-status');
      statusEl.classList.remove('hidden');

      for (let file of files) {
        statusEl.innerText = `Mengunggah ${file.name}...`;

        const metadata = {
          name: file.name,
          mimeType: file.type || 'audio/mpeg'
        };

        if (currentAlbumId !== 'all') {
          metadata.parents = [currentAlbumId];
        }

        const formData = new FormData();
        formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        formData.append('file', file);

        try {
          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { Authorization: `Bearer ${accessToken}` },
            body: formData
          });
        } catch (err) {
          console.error(err);
        }
      }

      statusEl.classList.add('hidden');
      event.target.value = '';
      syncDriveData();
    }

    async function syncDriveData() {
      try {
        const folderRes = await fetch(
          "https://www.googleapis.com/drive/v3/files?q=mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id, name)",
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        if (folderRes.status === 401) { handleLogout(); return; }
        const folderData = await folderRes.json();
        
        driveFolders = [{ id: 'all', name: 'Semua' }, ...(folderData.files || [])];
        renderAlbumTabs();

        const fileRes = await fetch(
          "https://www.googleapis.com/drive/v3/files?q=mimeType contains 'audio/' and trashed=false&fields=files(id, name, parents)",
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const fileData = await fileRes.json();

        playlist = (fileData.files || []).map(file => ({
          ...file,
          folderId: file.parents ? file.parents[0] : null
        }));

        renderPlaylist();
      } catch (err) {
        console.error('Gagal melakukan sinkronisasi dengan Google Drive:', err);
      }
    }

    function renderAlbumTabs() {
      const container = document.getElementById('album-tabs');
      container.innerHTML = '';

      driveFolders.forEach(folder => {
        const isActive = folder.id === currentAlbumId;
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-center gap-1 flex-shrink-0';

        const btn = document.createElement('button');
        btn.className = `album-btn text-[11px] px-2.5 py-1 rounded-lg font-medium transition ${
          isActive ? 'bg-indigo-600 text-white' : 'bg-[#0e1322] text-slate-400 hover:text-white border border-slate-800'
        }`;
        btn.innerText = folder.name;
        btn.onclick = () => filterByAlbum(folder.id);
        wrapper.appendChild(btn);

        if (folder.id !== 'all') {
          const delBtn = document.createElement('button');
          delBtn.className = 'text-slate-500 hover:text-red-400 p-0.5 transition';
          delBtn.title = 'Hapus Album';
          delBtn.innerHTML = '<i data-lucide="x" class="w-3 h-3"></i>';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteFileOrFolder(folder.id, folder.name, true);
          };
          wrapper.appendChild(delBtn);
        }

        container.appendChild(wrapper);
      });
      lucide.createIcons();
    }

    function filterByAlbum(folderId) {
      currentAlbumId = folderId;
      renderAlbumTabs();
      renderPlaylist();
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist-container');
      container.innerHTML = '';

      const filteredList = currentAlbumId === 'all'
        ? playlist
        : playlist.filter(item => item.folderId === currentAlbumId);

      document.getElementById('track-count').innerText = `${filteredList.length} Lagu`;

      if (filteredList.length === 0) {
        container.innerHTML = '<div class="text-slate-400 text-xs text-center py-10">Tidak ada lagu di album ini.</div>';
        return;
      }

      filteredList.forEach((file) => {
        const originalIndex = playlist.findIndex(t => t.id === file.id);
        const isActive = originalIndex === currentTrackIndex;

        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2 rounded-xl border cursor-pointer transition ${
          isActive 
            ? 'bg-indigo-900/30 border-indigo-500/80 text-indigo-200' 
            : 'bg-[#0e1322] border-slate-800/80 hover:border-slate-700 text-slate-300'
        }`;
        item.onclick = () => playTrack(originalIndex);

        item.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden mr-2">
            <div class="w-7 h-7 rounded-lg ${isActive ? 'bg-indigo-600 text-white' : 'bg-indigo-950 text-indigo-400'} flex items-center justify-center flex-shrink-0">
              <i data-lucide="${isActive ? 'disc' : 'music'}" class="w-4 h-4"></i>
            </div>
            <div class="text-xs font-medium truncate">${file.name}</div>
          </div>
          <button onclick="event.stopPropagation(); deleteFileOrFolder('${file.id}', '${file.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition flex-shrink-0" title="Hapus Lagu">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    async function deleteFileOrFolder(id, name, isFolder = false) {
      const typeStr = isFolder ? 'album' : 'lagu';
      if (!confirm(`Apakah Anda yakin ingin menghapus ${typeStr} "${name}" dari Google Drive?`)) {
        return;
      }

      if (!accessToken) {
        alert('Silakan login Google Drive terlebih dahulu!');
        return;
      }

      try {
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${accessToken}`
          }
        });

        if (res.ok || res.status === 204) {
          if (isFolder && currentAlbumId === id) {
            currentAlbumId = 'all';
          }
          await syncDriveData();
        } else {
          alert(`Gagal menghapus ${typeStr}.`);
        }
      } catch (err) {
        console.error(err);
        alert(`Terjadi kesalahan saat menghapus ${typeStr}.`);
      }
    }

    async function playTrack(index) {
      initAudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      currentTrackIndex = index;
      const file = playlist[index];
      document.getElementById('current-title').innerText = file.name;
      renderPlaylist();

      try {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );

        if (!res.ok) throw new Error('File gagal dimuat');

        const blob = await res.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        audioPlayer.play();
        updatePlayButton(true);
      } catch (err) {
        alert('Gagal memutar lagu dari Drive.');
        console.error(err);
      }
    }

    function togglePlay() {
      if (!audioPlayer.src) return;
      if (audioPlayer.paused) {
        audioPlayer.play();
        updatePlayButton(true);
      } else {
        audioPlayer.pause();
        updatePlayButton(false);
      }
    }

    function updatePlayButton(isPlaying) {
      const btn = document.getElementById('play-btn');
      const vinylDisc = document.getElementById('vinyl-disc');
      const tonearm = document.getElementById('tonearm');

      if (isPlaying) {
        btn.innerHTML = '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
        vinylDisc.classList.add('animate-spin-vinyl');
        tonearm.classList.remove('tonearm-idle');
        tonearm.classList.add('tonearm-playing');
      } else {
        btn.innerHTML = '<i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>';
        vinylDisc.classList.remove('animate-spin-vinyl');
        tonearm.classList.remove('tonearm-playing');
        tonearm.classList.add('tonearm-idle');
      }
      lucide.createIcons();
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      if (isShuffle) {
        let randomIndex = Math.floor(Math.random() * playlist.length);
        playTrack(randomIndex);
      } else {
        const next = (currentTrackIndex + 1) % playlist.length;
        playTrack(next);
      }
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      const prev = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    function adjustVolume() {
      audioPlayer.volume = document.getElementById('volume-bar').value;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('shuffle-btn');
      btn.className = isShuffle ? 'text-indigo-400 font-bold transition' : 'text-slate-400 hover:text-white transition';
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      const btn = document.getElementById('repeat-btn');
      btn.className = isRepeat ? 'text-indigo-400 font-bold transition' : 'text-slate-400 hover:text-white transition';
    }

    audioPlayer.ontimeupdate = () => {
      if (!isNaN(audioPlayer.duration)) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        document.getElementById('seek-bar').value = percent;
        document.getElementById('current-time').innerText = formatTime(audioPlayer.currentTime);
        document.getElementById('duration-time').innerText = formatTime(audioPlayer.duration);
      }
    };

    function seekAudio() {
      const seekTo = (document.getElementById('seek-bar').value / 100) * audioPlayer.duration;
      audioPlayer.currentTime = seekTo;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audioPlayer.onended = () => {
      if (isRepeat) {
        playTrack(currentTrackIndex);
      } else {
        nextTrack();
      }
    };
  </script>

</body>
</html>
