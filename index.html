<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrasLupi Musik - Cloud Sync</title>

  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* Styling Scrollbar & Input Range */
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      height: 6px;
      border-radius: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(129, 140, 248, 0.5);
    }

    /* Animasi Vinyl */
    @keyframes spin-vinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-vinyl {
      animation: spin-vinyl 3.5s linear infinite;
    }

    /* Tekstur Piringan Hitam */
    .vinyl-grooves {
      background: 
        radial-gradient(circle, #000 15%, transparent 16%),
        conic-gradient(from 0deg, rgba(255,255,255,0.08) 0deg, transparent 60deg, rgba(255,255,255,0.12) 120deg, transparent 180deg, rgba(255,255,255,0.08) 240deg, transparent 300deg, rgba(255,255,255,0.12) 360deg),
        repeating-radial-gradient(circle, #1e2538 0px, #0f1422 3px, #2a334d 5px, #111726 8px);
    }

    /* Posisi Tonearm */
    .tonearm-wrapper {
      position: absolute;
      top: 10px;
      right: 15px;
      width: 40px;
      height: 140px;
      pointer-events: none;
      z-index: 20;
    }

    @media (min-width: 640px) {
      .tonearm-wrapper {
        top: 15px;
        right: 25px;
        width: 45px;
        height: 160px;
      }
    }

    .tonearm {
      transform-origin: 16px 16px;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (min-width: 640px) {
      .tonearm {
        transform-origin: 18px 18px;
      }
    }

    .tonearm-playing { transform: rotate(52deg); }
    .tonearm-idle { transform: rotate(0deg); }
    
    /* Sembunyikan Scrollbar Tab Album */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Scrollbar Playlist */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0e1322;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    /* Animasi Teks Berjalan (Marquee) */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 12s linear infinite;
    }

    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen md:h-screen w-full flex flex-col p-3 md:p-5 font-sans overflow-x-hidden md:overflow-hidden">

  <!-- HEADER -->
  <header class="w-full max-w-7xl mx-auto flex justify-between items-center bg-[#151c2e] px-4 py-3 rounded-xl border border-slate-800/80 shadow-lg mb-3 flex-shrink-0">
    <div class="flex items-center gap-2.5">
      <i data-lucide="disc-3" class="text-indigo-400 w-6 h-6 animate-spin-slow"></i>
      <h1 class="font-bold text-base sm:text-lg tracking-wide text-slate-100">PrasLupi <span class="text-indigo-400">Musik</span></h1>
    </div>
    <div id="auth-section">
      <button id="login-btn" onclick="handleAuthClick()" class="py-1.5 px-3 sm:px-4 bg-indigo-600 hover:bg-indigo-500 font-medium rounded-lg text-xs transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20">
        <i data-lucide="cloud" class="w-4 h-4"></i> Sync Drive
      </button>
      <button id="logout-btn" onclick="handleLogout()" class="hidden py-1.5 px-3 sm:px-4 bg-red-500 hover:bg-red-600 font-medium rounded-lg text-xs transition flex items-center gap-1.5 shadow-md shadow-red-500/20">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-4 flex-1 min-h-0 md:overflow-hidden">

    <!-- LEFT COLUMN: PLAYER & EQUALIZER -->
    <section class="md:col-span-5 flex flex-col gap-3 h-full min-h-0">
      
      <!-- PLAYER CARD -->
      <div class="bg-[#151c2e] p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between flex-1 min-h-0">
        
        <!-- VINYL ARTWORK CONTAINER -->
        <div class="relative bg-[#090d16] border border-slate-800/90 p-4 rounded-xl flex items-center justify-center overflow-hidden shadow-inner h-48 sm:h-56 md:h-52 lg:h-60 flex-shrink-0">
          
          <!-- PIRINGAN HITAM -->
          <div id="vinyl-disc" class="w-36 h-36 sm:w-44 sm:h-44 lg:w-48 lg:h-48 rounded-full vinyl-grooves border-4 border-slate-700/80 shadow-[0_0_25px_rgba(0,0,0,0.8)] flex items-center justify-center relative transition-transform">
            <!-- Stiker Tengah -->
            <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 border-2 border-slate-900 flex items-center justify-center shadow-lg">
              <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-[#0b0f19] border border-slate-700"></div>
            </div>
          </div>

          <!-- TONEARM -->
          <div class="tonearm-wrapper">
            <div id="tonearm" class="tonearm tonearm-idle flex flex-col items-center">
              <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-b from-slate-600 to-slate-800 border-2 border-slate-400 shadow-lg flex items-center justify-center flex-shrink-0">
                <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-slate-900 border border-slate-600"></div>
              </div>
              <div class="w-1.5 h-20 sm:h-24 bg-gradient-to-r from-slate-300 via-slate-100 to-slate-400 rounded-full -mt-1 shadow-md"></div>
              <div class="w-3 sm:w-3.5 h-5 sm:h-6 bg-slate-900 border border-slate-500 rounded-sm -mt-1 shadow-md transform -rotate-12"></div>
            </div>
          </div>

        </div>

        <!-- TRACK INFO & VISUALIZER -->
        <div class="my-3">
          <div class="marquee-container text-center font-semibold text-slate-200 text-xs sm:text-sm px-2 mb-2">
            <span id="current-title" class="inline-block">Tidak ada lagu dipilih</span>
          </div>
          <div class="w-full bg-[#0e1322] p-1.5 rounded-lg border border-slate-800 flex justify-center items-center">
            <canvas id="visualizer" class="w-full h-6 rounded"></canvas>
          </div>
        </div>

        <audio id="audio-player" crossorigin="anonymous"></audio>

        <!-- PROGRESS BAR -->
        <div class="flex items-center gap-2 text-[11px] text-slate-400 mb-2">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekAudio()" class="w-full cursor-pointer">
          <span id="duration-time">0:00</span>
        </div>

        <!-- CONTROLS -->
        <div class="flex flex-col gap-2.5">
          <div class="flex justify-between items-center px-3">
            <button id="shuffle-btn" onclick="toggleShuffle()" class="text-slate-400 hover:text-white transition p-1" title="Acak">
              <i data-lucide="shuffle" class="w-4 h-4"></i>
            </button>
            <div class="flex items-center gap-6">
              <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition p-1">
                <i data-lucide="skip-back" class="w-5 h-5"></i>
              </button>
              <button id="play-btn" onclick="togglePlay()" class="w-11 h-11 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center transition shadow-lg shadow-indigo-600/40">
                <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
              </button>
              <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition p-1">
                <i data-lucide="skip-forward" class="w-5 h-5"></i>
              </button>
            </div>
            <button id="repeat-btn" onclick="toggleRepeat()" class="text-slate-400 hover:text-white transition p-1" title="Ulangi">
              <i data-lucide="repeat" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex items-center gap-2.5 bg-[#0e1322] px-3 py-2 rounded-xl border border-slate-800">
            <i data-lucide="volume-2" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" oninput="adjustVolume()" class="w-full cursor-pointer">
          </div>
        </div>

      </div>

      <!-- EQUALIZER CARD -->
      <div class="bg-[#151c2e] p-3.5 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-2 flex-shrink-0">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2 font-bold text-xs text-slate-200">
            <i data-lucide="sliders" class="text-indigo-400 w-4 h-4"></i> Equalizer
          </div>
          <button onclick="resetEQ()" class="text-[11px] text-slate-400 hover:text-white flex items-center gap-1 transition">
            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-[#0e1322] p-2.5 rounded-xl border border-slate-800">
            <div class="flex justify-between text-[11px] mb-1.5">
              <span class="text-emerald-400 font-medium">Bass</span>
              <span id="bass-val" class="font-bold text-emerald-400">0 dB</span>
            </div>
            <input type="range" id="bass" min="-12" max="12" value="0" oninput="updateEQ()" class="w-full cursor-pointer">
          </div>

          <div class="bg-[#0e1322] p-2.5 rounded-xl border border-slate-800">
            <div class="flex justify-between text-[11px] mb-1.5">
              <span class="text-pink-400 font-medium">Vokal</span>
              <span id="vokal-val" class="font-bold text-pink-400">0 dB</span>
            </div>
            <input type="range" id="vokal" min="-12" max="12" value="0" oninput="updateEQ()" class="w-full cursor-pointer">
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT COLUMN: PLAYLIST & ALBUM -->
    <section class="md:col-span-7 bg-[#151c2e] p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col h-[500px] md:h-full min-h-0 overflow-hidden">
      
      <!-- HEADER PLAYLIST -->
      <div class="flex justify-between items-center mb-3 flex-shrink-0">
        <div class="flex items-center gap-2 font-bold text-sm sm:text-base text-slate-100">
          <i data-lucide="folder-heart" class="text-indigo-400 w-5 h-5"></i> Playlist & Album
        </div>
        <span id="track-count" class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 text-[11px] px-2.5 py-0.5 rounded-full font-medium">0 Lagu</span>
      </div>

      <!-- ALBUM & UPLOAD ACTIONS -->
      <div class="flex flex-col gap-2.5 mb-3 flex-shrink-0">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="file" id="local-file-input" accept="audio/*" multiple class="hidden" onchange="uploadToGoogleDrive(event)">
          <button onclick="triggerUpload()" id="upload-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold py-2 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/20">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i> Tambah Lagu
          </button>

          <div class="flex gap-1.5">
            <input type="text" id="album-input" placeholder="Album Baru..." class="flex-grow bg-[#0e1322] text-xs px-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            <button onclick="createAlbumFolder()" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1 flex-shrink-0">
              <i data-lucide="folder-plus" class="w-4 h-4"></i> Buat
            </button>
          </div>
        </div>

        <div id="upload-status" class="hidden text-xs text-indigo-300 text-center py-1.5 bg-[#0e1322] rounded-xl border border-slate-800 animate-pulse">
          Proses unggah lagu ke Google Drive...
        </div>

        <!-- ALBUM TABS -->
        <div class="flex items-center gap-1.5 overflow-x-auto py-1 no-scrollbar" id="album-tabs">
          <button class="album-btn bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-xl font-medium transition flex-shrink-0">Semua</button>
        </div>
      </div>

      <!-- PLAYLIST ITEM CONTAINER -->
      <div id="playlist-container" class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto pr-1">
        <div class="text-slate-400 text-xs text-center py-12">Silakan "Sync Google Drive" untuk memuat lagu & album.</div>
      </div>

    </section>

  </main>

  <script>
    const CLIENT_ID = '524216548694-b7dsledl0lvtrhpbhgp2dkbpgn0ro6hn.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let playlist = [];
    let driveFolders = [{ id: 'all', name: 'Semua' }];
    let currentAlbumId = 'all';
    let currentTrackIndex = -1;

    let isShuffle = false;
    let isRepeat = false;

    let audioCtx, trackSource, bassFilter, vokalFilter, analyser;
    const audioPlayer = document.getElementById('audio-player');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        trackSource = audioCtx.createMediaElementSource(audioPlayer);

        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 250;

        vokalFilter = audioCtx.createBiquadFilter();
        vokalFilter.type = 'peaking';
        vokalFilter.frequency.value = 1000;
        vokalFilter.Q.value = 1;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        trackSource.connect(bassFilter);
        bassFilter.connect(vokalFilter);
        vokalFilter.connect(analyser);
        analyser.connect(audioCtx.destination);

        drawVisualizer();
      }
    }

    function drawVisualizer() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function renderFrame() {
        requestAnimationFrame(renderFrame);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 1.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = (dataArray[i] / 255) * canvas.height;

          const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
          gradient.addColorStop(0, '#6366f1');
          gradient.addColorStop(1, '#ec4899');

          canvasCtx.fillStyle = gradient;
          canvasCtx.beginPath();
          canvasCtx.roundRect(x, canvas.height - barHeight, barWidth - 2, barHeight, 3);
          canvasCtx.fill();

          x += barWidth + 1;
        }
      }
      renderFrame();
    }

    function updateEQ() {
      const bass = document.getElementById('bass').value;
      const vokal = document.getElementById('vokal').value;

      document.getElementById('bass-val').innerText = `${bass} dB`;
      document.getElementById('vokal-val').innerText = `${vokal} dB`;

      if (bassFilter) bassFilter.gain.value = bass;
      if (vokalFilter) vokalFilter.gain.value = vokal;
    }

    function resetEQ() {
      document.getElementById('bass').value = 0;
      document.getElementById('vokal').value = 0;
      updateEQ();
    }

    window.onload = () => {
      lucide.createIcons();

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            localStorage.setItem('gdrive_access_token', accessToken);
            onLoginSuccess();
          }
        },
      });

      const savedToken = localStorage.getItem('gdrive_access_token');
      if (savedToken) {
        accessToken = savedToken;
        onLoginSuccess();
      }
    };

    function handleAuthClick() {
      if (!accessToken) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      }
    }

    function handleLogout() {
      localStorage.removeItem('gdrive_access_token');
      accessToken = null;
      location.reload();
    }

    function onLoginSuccess() {
      document.getElementById('login-btn').classList.add('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      syncDriveData();
    }

    async function createAlbumFolder() {
      const nameInput = document.getElementById('album-input');
      const folderName = nameInput.value.trim();

      if (!folderName) {
        alert('Masukkan nama album terlebih dahulu!');
        return;
      }
      if (!accessToken) {
        alert('Silakan login Google Drive terlebih dahulu!');
        return;
      }

      try {
        let res = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: folderName,
            mimeType: 'application/vnd.google-apps.folder'
          })
        });

        if (res.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        if (res.ok) {
          nameInput.value = '';
          await syncDriveData();
        } else {
          alert('Gagal membuat folder album di Google Drive.');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function triggerUpload() {
      if (!accessToken) {
        alert('Silakan Sync Google Drive terlebih dahulu!');
        handleAuthClick();
        return;
      }
      document.getElementById('local-file-input').click();
    }

    async function uploadToGoogleDrive(event) {
      const files = event.target.files;
      if (!files.length) return;

      const statusEl = document.getElementById('upload-status');
      statusEl.classList.remove('hidden');

      for (let file of files) {
        statusEl.innerText = `Mengunggah ${file.name}...`;

        const metadata = {
          name: file.name,
          mimeType: file.type || 'audio/mpeg'
        };

        if (currentAlbumId !== 'all') {
          metadata.parents = [currentAlbumId];
        }

        const formData = new FormData();
        formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        formData.append('file', file);

        try {
          let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { Authorization: `Bearer ${accessToken}` },
            body: formData
          });

          if (res.status === 401) {
            tokenClient.requestAccessToken({ prompt: '' });
            break;
          }
        } catch (err) {
          console.error(err);
        }
      }

      statusEl.classList.add('hidden');
      event.target.value = '';
      syncDriveData();
    }

    async function syncDriveData() {
      try {
        let folderRes = await fetch(
          "https://www.googleapis.com/drive/v3/files?q=mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id, name)",
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );

        if (folderRes.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        const folderData = await folderRes.json();
        driveFolders = [{ id: 'all', name: 'Semua' }, ...(folderData.files || [])];
        renderAlbumTabs();

        let fileRes = await fetch(
          "https://www.googleapis.com/drive/v3/files?q=mimeType contains 'audio/' and trashed=false&fields=files(id, name, parents)",
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );

        if (fileRes.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        const fileData = await fileRes.json();

        playlist = (fileData.files || []).map(file => ({
          ...file,
          folderId: file.parents ? file.parents[0] : null
        }));

        renderPlaylist();
      } catch (err) {
        console.error('Gagal melakukan sinkronisasi dengan Google Drive:', err);
      }
    }

    function renderAlbumTabs() {
      const container = document.getElementById('album-tabs');
      container.innerHTML = '';

      driveFolders.forEach(folder => {
        const isActive = folder.id === currentAlbumId;
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-center gap-1 flex-shrink-0';

        const btn = document.createElement('button');
        btn.className = `album-btn text-xs px-3 py-1.5 rounded-xl font-medium transition ${
          isActive ? 'bg-indigo-600 text-white' : 'bg-[#0e1322] text-slate-400 hover:text-white border border-slate-800'
        }`;
        btn.innerText = folder.name;
        btn.onclick = () => filterByAlbum(folder.id);
        wrapper.appendChild(btn);

        if (folder.id !== 'all') {
          const delBtn = document.createElement('button');
          delBtn.className = 'text-slate-500 hover:text-red-400 p-1 transition';
          delBtn.title = 'Hapus Album';
          delBtn.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteFileOrFolder(folder.id, folder.name, true);
          };
          wrapper.appendChild(delBtn);
        }

        container.appendChild(wrapper);
      });
      lucide.createIcons();
    }

    function filterByAlbum(folderId) {
      currentAlbumId = folderId;
      renderAlbumTabs();
      renderPlaylist();
    }

    function showMoveDropdown(fileId) {
      const btn = document.getElementById(`move-btn-${fileId}`);
      const moveBox = document.getElementById(`move-box-${fileId}`);
      if (btn && moveBox) {
        btn.classList.add('hidden');
        moveBox.classList.remove('hidden');
        moveBox.classList.add('flex');
      }
    }

    async function saveMoveFile(fileId, currentFolderId) {
      if (!accessToken) {
        alert('Silakan login Google Drive terlebih dahulu!');
        return;
      }

      const select = document.getElementById(`move-select-${fileId}`);
      const targetFolderId = select ? select.value : currentFolderId;

      if (targetFolderId === currentFolderId) {
        renderPlaylist();
        return;
      }

      const saveBtn = document.getElementById(`save-btn-${fileId}`);
      if (saveBtn) {
        saveBtn.innerText = '...';
        saveBtn.disabled = true;
      }

      try {
        let addParents = '';
        let removeParents = '';

        if (targetFolderId !== 'all') {
          addParents = `&addParents=${targetFolderId}`;
        }
        if (currentFolderId && currentFolderId !== 'all') {
          removeParents = `&removeParents=${currentFolderId}`;
        }

        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?supportsAllDrives=true${addParents}${removeParents}`,
          {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json'
            }
          }
        );

        if (res.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        if (res.ok) {
          await syncDriveData();
        } else {
          alert('Gagal memindahkan lagu di Google Drive.');
          renderPlaylist();
        }
      } catch (err) {
        console.error('Error moving file:', err);
        alert('Terjadi kesalahan saat memindahkan file.');
        renderPlaylist();
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist-container');
      container.innerHTML = '';

      const filteredList = currentAlbumId === 'all'
        ? playlist
        : playlist.filter(item => item.folderId === currentAlbumId);

      document.getElementById('track-count').innerText = `${filteredList.length} Lagu`;

      if (filteredList.length === 0) {
        container.innerHTML = '<div class="text-slate-400 text-xs text-center py-12">Tidak ada lagu di album ini.</div>';
        return;
      }

      filteredList.forEach((file) => {
        const originalIndex = playlist.findIndex(t => t.id === file.id);
        const isActive = originalIndex === currentTrackIndex;

        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2.5 rounded-xl border transition ${
          isActive 
            ? 'bg-indigo-900/30 border-indigo-500/80 text-indigo-200' 
            : 'bg-[#0e1322] border-slate-800/80 hover:border-slate-700 text-slate-300'
        }`;

        const folderOptions = driveFolders.map(f => 
          `<option value="${f.id}" ${file.folderId === f.id || (f.id === 'all' && !file.folderId) ? 'selected' : ''}>${f.name}</option>`
        ).join('');

        item.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden mr-2 cursor-pointer flex-grow min-w-0" onclick="playTrack(${originalIndex})">
            <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-indigo-600 text-white' : 'bg-indigo-950 text-indigo-400'} flex items-center justify-center flex-shrink-0">
              <i data-lucide="${isActive ? 'disc' : 'music'}" class="w-4 h-4"></i>
            </div>
            <div class="text-xs font-medium truncate min-w-0 flex-1">${file.name}</div>
          </div>

          <div class="flex items-center gap-1.5 flex-shrink-0" onclick="event.stopPropagation()">
            <button id="move-btn-${file.id}" onclick="showMoveDropdown('${file.id}')" class="bg-[#151c2e] hover:bg-indigo-900/50 text-slate-300 border border-slate-700 hover:border-indigo-500 text-[10px] px-2 py-1 rounded-lg transition flex items-center gap-1">
              <i data-lucide="folder-output" class="w-3 h-3 text-indigo-400"></i> Pindah
            </button>

            <div id="move-box-${file.id}" class="hidden items-center gap-1">
              <select id="move-select-${file.id}" class="bg-[#151c2e] text-[10px] text-slate-200 border border-indigo-500 rounded px-1.5 py-1 focus:outline-none">
                ${folderOptions}
              </select>
              <button id="save-btn-${file.id}" onclick="saveMoveFile('${file.id}', '${file.folderId}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-[10px] px-2 py-1 rounded transition flex items-center gap-0.5">
                <i data-lucide="check" class="w-3 h-3"></i> Save
              </button>
            </div>

            <button onclick="deleteFileOrFolder('${file.id}', '${file.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition" title="Hapus Lagu">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    async function deleteFileOrFolder(id, name, isFolder = false) {
      const typeStr = isFolder ? 'album' : 'lagu';
      if (!confirm(`Apakah Anda yakin ingin menghapus ${typeStr} "${name}" dari Google Drive?`)) {
        return;
      }

      if (!accessToken) {
        alert('Silakan login Google Drive terlebih dahulu!');
        return;
      }

      try {
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${accessToken}`
          }
        });

        if (res.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        if (res.ok || res.status === 204) {
          if (isFolder && currentAlbumId === id) {
            currentAlbumId = 'all';
          }
          await syncDriveData();
        } else {
          alert(`Gagal menghapus ${typeStr}.`);
        }
      } catch (err) {
        console.error(err);
        alert(`Terjadi kesalahan saat menghapus ${typeStr}.`);
      }
    }

    async function playTrack(index) {
      initAudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      currentTrackIndex = index;
      const file = playlist[index];
      
      const titleEl = document.getElementById('current-title');
      titleEl.innerText = file.name;
      titleEl.classList.add('animate-marquee');

      renderPlaylist();

      try {
        const streamUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`;

        const res = await fetch(streamUrl, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (res.status === 401) {
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }

        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const blob = await res.blob();

        if (audioPlayer.src && audioPlayer.src.startsWith('blob:')) {
          URL.revokeObjectURL(audioPlayer.src);
        }

        const audioBlobUrl = URL.createObjectURL(blob);
        audioPlayer.src = audioBlobUrl;

        await audioPlayer.play();
        updatePlayButton(true);

      } catch (err) {
        console.error("Detail Error Playback:", err);
        try {
          audioPlayer.src = `https://lh3.googleusercontent.com/d/${file.id}`;
          await audioPlayer.play();
          updatePlayButton(true);
        } catch (fallbackErr) {
          alert('Gagal memutar lagu dari Drive. Silakan coba klik Sync Drive lagi.');
          updatePlayButton(false);
        }
      }
    }

    function togglePlay() {
      if (!audioPlayer.src) return;
      if (audioPlayer.paused) {
        audioPlayer.play();
        updatePlayButton(true);
      } else {
        audioPlayer.pause();
        updatePlayButton(false);
      }
    }

    function updatePlayButton(isPlaying) {
      const btn = document.getElementById('play-btn');
      const vinylDisc = document.getElementById('vinyl-disc');
      const tonearm = document.getElementById('tonearm');

      if (isPlaying) {
        btn.innerHTML = '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
        vinylDisc.classList.add('animate-spin-vinyl');
        tonearm.classList.remove('tonearm-idle');
        tonearm.classList.add('tonearm-playing');
      } else {
        btn.innerHTML = '<i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>';
        vinylDisc.classList.remove('animate-spin-vinyl');
        tonearm.classList.remove('tonearm-playing');
        tonearm.classList.add('tonearm-idle');
      }
      lucide.createIcons();
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      if (isShuffle) {
        let randomIndex = Math.floor(Math.random() * playlist.length);
        playTrack(randomIndex);
      } else {
        const next = (currentTrackIndex + 1) % playlist.length;
        playTrack(next);
      }
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      const prev = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    function adjustVolume() {
      audioPlayer.volume = document.getElementById('volume-bar').value;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('shuffle-btn');
      btn.className = isShuffle ? 'text-indigo-400 font-bold transition p-1' : 'text-slate-400 hover:text-white transition p-1';
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      const btn = document.getElementById('repeat-btn');
      btn.className = isRepeat ? 'text-indigo-400 font-bold transition p-1' : 'text-slate-400 hover:text-white transition p-1';
    }

    audioPlayer.ontimeupdate = () => {
      if (!isNaN(audioPlayer.duration)) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        document.getElementById('seek-bar').value = percent;
        document.getElementById('current-time').innerText = formatTime(audioPlayer.currentTime);
        document.getElementById('duration-time').innerText = formatTime(audioPlayer.duration);
      }
    };

    function seekAudio() {
      const seekTo = (document.getElementById('seek-bar').value / 100) * audioPlayer.duration;
      audioPlayer.currentTime = seekTo;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audioPlayer.onended = () => {
      if (isRepeat) {
        playTrack(currentTrackIndex);
      } else {
        nextTrack();
      }
    };
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
  
</body>
